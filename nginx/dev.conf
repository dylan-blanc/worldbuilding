# Proxies the Nuxt development server and PHP API while enforcing local admin access, CSRF traffic limits and same-origin routing.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=login_rate:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=register_rate:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=csrf_rate:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=link_inspection_rate:10m rate=20r/m;

server {
  listen 80;
  server_name _;

  # Empache l'acces aux dotfiles (.env, .git, etc.) et redirige vers l'accueil
  location ~ (^|/)\.(?!well-known)(?!vite).* {
    # renvoi vers l'accueil
    return 302 http://$http_host/;
  }

  location ^~ /_nuxt/ {
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }

  location ^~ /api/ {
    client_max_body_size 260m;
    proxy_pass http://backend:80;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Chaque inspection utilise DNS, TLS et de la bande passante distante : 20 requêtes/minute sont admises par IP,
  # avec une rafale de 5, avant que Nginx retourne 429 sans transmettre la demande à PHP.
  location = /api/links/inspect {
    limit_req zone=link_inspection_rate burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/login {
    client_max_body_size 32k;
    limit_req zone=login_rate burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/register {
    client_max_body_size 32k;
    limit_req zone=register_rate burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/csrf {
    limit_req zone=csrf_rate burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Protect every administration route with the database-backed PHP session role.
  location ~ ^/adminpanel(?:/|$) {
    auth_request /_admin_access;
    error_page 403 = @admin_denied;

    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }

  # Keep the authorization endpoint unreachable from public HTTP requests.
  location = /_admin_access {
    internal;
    proxy_pass http://backend:80/api/admin/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
  }

  location @admin_denied {
    return 302 http://$http_host/;
  }

  location / {
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }

  server_tokens off;
}
