map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  # Empache l'acces aux dotfiles (.env, .git, etc.) et redirige vers l'accueil
  location ~ (^|/)\.(?!well-known)(?!vite).* {
    # renvoi vers l'accueil
    return 302 http://$http_host/;
  }

  location ^~ /_nuxt/ {
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }

  location ^~ /api/ {
    client_max_body_size 260m;
    proxy_pass http://backend:80;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Protect every administration route with the database-backed PHP session role.
  location ~ ^/adminpanel(?:/|$) {
    auth_request /_admin_access;
    error_page 403 = @admin_denied;

    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }

  # Keep the authorization endpoint unreachable from public HTTP requests.
  location = /_admin_access {
    internal;
    proxy_pass http://backend:80/api/admin/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
  }

  location @admin_denied {
    return 302 http://$http_host/;
  }

  location / {
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }

  server_tokens off;
}
