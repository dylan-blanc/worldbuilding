# This host-level gateway is installed in /etc/nginx/sites-available and is the only public listener.
# It terminates TLS, serves Certbot challenges, and routes each domain to its loopback-only Docker Nginx.
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# limite les appel à /api/links/inspect à 20 requêtes par minute par IP, avec un maximum de 5 requêtes successives avant de renvoyer un code 429.
limit_req_zone $binary_remote_addr zone=link_inspection_rate:10m rate=20r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name molternate.com www.molternate.com worldbuilding.molternate.com;

    # Certbot writes challenges on the host and Nginx exposes them without involving either application.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Sensitive dotfile requests are sent directly to the HTTPS homepage.
    location ~ (^|/)\. {
        return 301 https://$host/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name molternate.com www.molternate.com;

    ssl_certificate /etc/letsencrypt/live/molternate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/molternate.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Dotfiles never reach the application and keep the requested homepage redirect behavior.
    location ~ (^|/)\. {
        return 302 https://$host/;
    }

    # A runtime-only proxy reaches the unchanged Cinetech frontend and backend containers.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name worldbuilding.molternate.com;

    ssl_certificate /etc/letsencrypt/live/worldbuilding.molternate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldbuilding.molternate.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Dotfiles never reach the application and keep the requested homepage redirect behavior.
    location ~ (^|/)\. {
        return 302 https://$host/;
    }

    # Applique la limite à l'entrée publique, où Nginx connaît encore l'IP réelle du visiteur : 20 requêtes/minute,
    # 5 succesif, puis réponse 429 avant le proxy vers le Nginx Docker et POST /api/links/inspect.
    location = /api/links/inspect {
        limit_req zone=link_inspection_rate burst=5 nodelay;
        limit_req_status 429;
        proxy_pass https://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_ssl_server_name on;
        proxy_ssl_name worldbuilding.molternate.com;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Reject oversized authentication payloads at the public edge before proxy buffering.
    location ~ ^/api/(?:login|register)$ {
        client_max_body_size 32k;
        proxy_pass https://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name worldbuilding.molternate.com;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Worldbuilding keeps its API and SSG routing inside its loopback-only Docker Nginx.
    location / {
        client_max_body_size 260m;
        proxy_pass https://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_ssl_server_name on;
        proxy_ssl_name worldbuilding.molternate.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/molternate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/molternate.com/privkey.pem;

    return 444;
}
