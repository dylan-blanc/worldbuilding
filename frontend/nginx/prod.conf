# Serves the production domain over HTTPS after start-production.sh detects the certificates.
# Requests flow from the public Nginx proxy to the static frontend or the PHP API through prod-locations.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

limit_req_zone $binary_remote_addr zone=login_rate:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=register_rate:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=csrf_rate:10m rate=30r/m;

server {
    listen 80;
    server_name worldbuilding.molternate.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name worldbuilding.molternate.com;

    ssl_certificate /etc/letsencrypt/live/worldbuilding.molternate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldbuilding.molternate.com/privkey.pem;
    server_tokens off;
    # Force browsers to use HTTPS for this domain and its subdomains for one year after the first secure response.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Disable MIME sniffing so browsers handle every response only as the Content-Type declared by the server.
    add_header X-Content-Type-Options "nosniff" always;
    # Send the full referrer on same-origin requests, only the origin cross-site, and nothing on HTTPS-to-HTTP downgrades.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Deny camera, microphone and geolocation access because the application does not require these browser capabilities.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Block every site from embedding the application in a frame to prevent clickjacking attacks.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # Check the origin of scripts, styles, images, media, fonts, API connections and form destinations loaded by the page.
    # Report violations only in browser console
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    include /etc/nginx/prod/locations.conf;
}
