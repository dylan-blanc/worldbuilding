  # HTTP : Redirection automatique vers le HTTPS
  server {
      listen 80;
      server_name worldbuilding.molternate.com;

      # Laisse passer les vérifications LetsEncrypt
      location /.well-known/acme-challenge/ {
          root /var/www/certbot;
      }

      # Redirige vers le HTTPS
      location / {
          return 301 https://$host$request_uri;
      }
  }

  # HTTPS
  server {
      listen 443 ssl;
      http2 on; # activer le HTTP2 (HTTPS)

      server_name worldbuilding.molternate.com;

      # Certificats SSL LetsEncrypt
      ssl_certificate /etc/letsencrypt/live/worldbuilding.molternate.com/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/worldbuilding.molternate.com/privkey.pem;

      # on affiche pas la version de nginx pour des raisons de sécurité
      server_tokens off;

      # Empeche l'accès aux dotfiles (.env, .git, etc.) et redirige vers l'accueil
      location ~ (^|/)\.(?!well-known)(?!vite).* {
          return 302 https://$http_host/;
      }

        location ^~ /_nuxt/ {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

      # API Backend
      location ^~ /api/ {
          client_max_body_size 260m;
          proxy_pass http://backend:80;
          proxy_http_version 1.1;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Protect every administration route with the database-backed PHP session role.
      location ~ ^/adminpanel(?:/|$) {
            # Demande au backend si la session appartient à un administrateur
          auth_request /_admin_access;
            # Envoie les refus du backend vers la redirection
          error_page 403 = @admin_denied;
            # Transmet la requête autorisée au frontend
          proxy_pass http://frontend:80;
            # Utilise HTTP/1.1 pour communiquer avec le backend dans le container docker
          proxy_http_version 1.1;
          proxy_set_header Host $host;
            # recupere l'ip du client pour le transmettre au backend (logs, permettra de ban les ip au besoin((serveur)))
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Keep the authorization endpoint unreachable from public HTTP requests.
      location = /_admin_access {
          internal;
          proxy_pass http://backend:80/api/admin/access;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Cookie $http_cookie;
          proxy_set_header Host $host;
          proxy_set_header X-Original-URI $request_uri;
      }
        # renvoi vers l'accueil si la requête est refusée par le backend (mettre l'adresse du domaine)
      location @admin_denied {
          return 302 /;
      }

      # Application Frontend
      location / {
          proxy_pass http://frontend:80;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }
  }
