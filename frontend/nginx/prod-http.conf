# Serves the production domain over HTTP until start-production.sh detects the TLS certificates.
# Requests flow from the public Nginx proxy to the static frontend or the PHP API through prod-locations.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name worldbuilding.molternate.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/prod/locations.conf;
}
