; This configuration bounds CMS uploads handled by PageMediaController before streaming them to MinIO.
; Nginx accepts the multipart request, PHP stores one temporary file, and MediaUploadValidator enforces the real per-type limit.
file_uploads = On
upload_max_filesize = 250M
post_max_size = 260M
max_file_uploads = 1
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
session.upload_progress.enabled = Off
